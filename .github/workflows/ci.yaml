---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER}/app-php-dev" >> $GITHUB_ENV
          echo "FULL_IMAGE=ghcr.io/${OWNER}/app-php-dev:${{ github.sha }}" >> $GITHUB_ENV
      - name: Build Docker images
        uses: docker/bake-action@v7
        env:
          IMAGES_PREFIX: ${{ env.IMAGE_NAME }}/
        with:
          push: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          tags: ${{ env.FULL_IMAGE }}
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max

  phpstan:
    name: PHPStan
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER}/app-php-dev" >> $GITHUB_ENV
          echo "FULL_IMAGE=ghcr.io/${OWNER}/app-php-dev:${{ github.sha }}" >> $GITHUB_ENV
      - name: Pull Docker image
        run: |
          docker pull ${{ env.FULL_IMAGE }}
          docker tag ${{ env.FULL_IMAGE }} app-php-dev
      - name: Start services
        run: docker compose up --no-build
      - name: Wait for services
        run: sleep 15
      - name: Run PHPStan
        run: docker compose exec -T php php -d memory_limit=512M vendor/bin/phpstan analyse --memory-limit=512M

  phpcsfixer:
    name: PHP-CS-Fixer
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER}/app-php-dev" >> $GITHUB_ENV
          echo "FULL_IMAGE=ghcr.io/${OWNER}/app-php-dev:${{ github.sha }}" >> $GITHUB_ENV
      - name: Pull Docker image
        run: |
          docker pull ${{ env.FULL_IMAGE }}
          docker tag ${{ env.FULL_IMAGE }} app-php-dev
      - name: Start services
        run: docker compose up --no-build
      - name: Wait for services
        run: sleep 15
      - name: Run PHP-CS-Fixer
        run: docker compose exec -T php php vendor/bin/php-cs-fixer fix --dry-run --diff

  security:
    name: Security Advisories
    needs: [phpstan, phpcsfixer]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER}/app-php-dev" >> $GITHUB_ENV
          echo "FULL_IMAGE=ghcr.io/${OWNER}/app-php-dev:${{ github.sha }}" >> $GITHUB_ENV
      - name: Pull Docker image
        run: |
          docker pull ${{ env.FULL_IMAGE }}
          docker tag ${{ env.FULL_IMAGE }} app-php-dev
      - name: Start services
        run: docker compose up --no-build
      - name: Wait for services
        run: sleep 15
      - name: Check Security Advisories
        run: docker compose exec -T php composer update --dry-run roave/security-advisories

  tests:
    name: Tests
    needs: [security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER}/app-php-dev" >> $GITHUB_ENV
          echo "FULL_IMAGE=ghcr.io/${OWNER}/app-php-dev:${{ github.sha }}" >> $GITHUB_ENV
      - name: Pull Docker image
        run: |
          docker pull ${{ env.FULL_IMAGE }}
          docker tag ${{ env.FULL_IMAGE }} app-php-dev
      - name: Start services
        run: docker compose up --no-build
      - name: Wait for services
        run: sleep 15
      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      - name: Check Mercure reachability
        run: curl -vI --insecure --fail-with-body https://localhost/.well-known/mercure?topic=test
      - name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create
      - name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      - name: Run PHPUnit
        run: docker compose exec -T php bin/phpunit
      - name: Doctrine Schema Validator
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate
