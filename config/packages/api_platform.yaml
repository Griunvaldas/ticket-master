api_platform:
    title: Ticket Master API
    version: 1.0.0
    use_symfony_listeners: true
    formats:
        json: [ 'application/json' ]
        jsonld: [ 'application/ld+json' ]
    defaults:
        format: 'json'
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        normalization_context:
            groups: ['event:read']
    error_formats:
        jsonld: [ 'application/ld+json' ]
        json: [ 'application/json' ]
